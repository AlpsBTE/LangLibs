name: Build & Upload LangLibs-Velocity

on:
  push:
    branches: [ "master" ]
    paths:
      - 'langlibs-velocity/**'
      - '.github/workflows/build-langlibs-velocity.yml'
      - 'gradle/**'
      - 'buildSrc/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'langlibs-velocity/**'
      - '.github/workflows/build-langlibs-velocity.yml'
      - 'gradle/**'
      - 'buildSrc/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew :LangLibs-Velocity:build

      - uses: actions/upload-artifact@v4
        with:
          name: Staging-Build
          path: langlibs-velocity/build/libs
          compression-level: '9'
